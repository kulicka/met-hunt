# Fly.io app config. First deploy: `fly launch --copy-config --no-deploy`, then `fly deploy`.
app = "met-hunt"
primary_region = "ewr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/closures"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
