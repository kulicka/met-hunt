# fly.toml app configuration file generated for met-hunt on 2026-10-22T18:11:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'met-hunt'
primary_region = 'ord'

[build]

[env]
  PORT = '8080'
  # The Fly runtime can set HOSTNAME to the machine id, overriding the Dockerfile's
  # value; Next's standalone server then listens only on that name and the proxy can't reach it.
  HOSTNAME = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/closures'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
