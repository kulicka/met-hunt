# Deploys main to Fly.io. Needs a FLY_API_TOKEN repository secret
# (create one with `fly tokens create deploy -a met-hunt`). Without it, this is skipped.
name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
